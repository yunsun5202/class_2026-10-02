<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World! - 語言與色彩切換</title>
  <!-- 載入 Tailwind CSS 與 Google 字體 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 平滑過渡效果 */
    .theme-transition {
      transition: background 0.6s ease, color 0.3s ease, border-color 0.3s ease;
    }
  </style>
</head>
<body id="bgContainer" class="theme-transition min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-sky-100 p-4">

  <main class="w-full max-w-lg">
    <!-- 主展示卡片 -->
    <div class="relative overflow-hidden rounded-3xl bg-white/85 p-6 sm:p-10 shadow-[0_20px_60px_rgba(0,0,0,0.06)] backdrop-blur-xl border border-white/70 transition-all duration-300">
      
      <!-- 頂部功能切換區 (語言選擇 + 顏色主題色票) -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-8 pb-4 border-b border-slate-100">
        <!-- 語言切換選單 -->
        <div class="flex items-center gap-2">
          <span class="text-base select-none">🌐</span>
          <select 
            id="langSelect" 
            class="text-xs font-semibold bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-slate-300 cursor-pointer transition-all"
            aria-label="選擇語言"
          >
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </div>

        <!-- 顏色主題色票切換 -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-slate-500 mr-1 select-none" id="themeLabel">主題色彩:</span>
          <div id="paletteContainer" class="flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-full border border-slate-200"></div>
        </div>
      </div>

      <!-- 頂部裝飾微標籤 -->
      <div class="flex justify-center mb-5">
        <div id="badgeContainer" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-50 border border-indigo-100/80 text-indigo-600 text-xs font-semibold tracking-wide uppercase shadow-sm transition-all duration-300">
          <span id="badgeDot" class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
          <span id="badgeText">第一支網頁程式</span>
        </div>
      </div>

      <!-- 主要標題 -->
      <h1 id="mainTitle" class="text-4xl sm:text-5xl font-extrabold text-slate-800 tracking-tight text-center mb-3 transition-all duration-300">
        你好，世界！
      </h1>

      <!-- 說明文案 -->
      <p id="subText" class="text-slate-500 text-sm sm:text-base leading-relaxed text-center mb-8 max-w-sm mx-auto transition-all duration-300">
        歡迎來到網頁開發的世界！這是一個支援多國語言與即時變換色彩風格的互動頁面。
      </p>

      <!-- 互動操作按鈕區 -->
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- 說聲嗨按鈕 -->
        <button 
          id="greetBtn"
          class="flex-1 py-3 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>👋</span>
          <span id="greetBtnText">打個招呼</span>
        </button>

        <!-- 隨機換色按鈕 -->
        <button 
          id="randomColorBtn"
          class="py-3 px-5 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 font-medium transition-all flex items-center justify-center gap-2 cursor-pointer"
          title="隨機切換色彩"
        >
          <span>🎨</span>
          <span id="randomColorBtnText">隨機風格</span>
        </button>
      </div>

      <!-- 提示訊息 Toast -->
      <div 
        id="toast" 
        class="opacity-0 translate-y-3 pointer-events-none transition-all duration-300 absolute inset-x-8 bottom-6 py-2.5 px-4 rounded-xl bg-slate-900/90 text-white text-xs font-medium shadow-xl backdrop-blur-sm text-center"
      >
        <span id="toastText">✨ 很高興遇見你！祝你有美好的一天。</span>
      </div>

    </div>

    <!-- 頁尾備註 -->
    <p id="footerText" class="text-center text-xs text-slate-400 mt-6 tracking-wide">
      HTML5 + Tailwind CSS &bull; 支援語言與豐富色彩切換
    </p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
